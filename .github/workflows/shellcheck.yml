name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar los scripts
        run: |
          shellcheck --version
          shellcheck bin/medios install.sh uninstall.sh docker/entrypoint.sh .github/notas-version.sh
