name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clave SSH falsa para probar el entrypoint de Docker
        run: |
          sudo mkdir -p /ssh
          sudo touch /ssh/clave
          sudo chmod 644 /ssh/clave
      - name: Ejecutar los tests
        run: python3 -m unittest discover -s tests -v
